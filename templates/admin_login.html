{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block content %}
<section class="section-wrapper" style="max-width:500px; text-align:center; padding:5rem 2rem;">
  <h2>Secure Administrator Login</h2>
  <p style="color:rgba(0,0,0,0.6); margin:1rem 0 2rem 0;">Enter administrative credentials to access trek management consoles.</p>
  <form method="post" action="{{ url_for('admin_login') }}" style="display:flex; flex-direction:column; gap:1rem;">
    {{ csrf() }}
    <input type="text" name="username" class="form-input" placeholder="Admin Username" required autocomplete="username">
    <input type="password" name="password" class="form-input" placeholder="Password" required autocomplete="current-password">
    <button type="submit" class="btn btn-primary" style="justify-content:center;">Unlock Console</button>
  </form>
</section>
{% endblock %}
